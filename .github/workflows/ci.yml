name: CI

# Roda em pull request e em push para a branch base (branch_base em docs/PROCESSO.md).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Projeto: preencha aqui o setup da stack (versão da linguagem e instalação das dependências).
      # Enquanto este passo não existir, os comandos da Configuração podem falhar por falta de ambiente.

      - name: Verificação configurada em docs/PROCESSO.md
        run: sh scripts/ci.sh
