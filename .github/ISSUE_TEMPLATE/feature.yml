name: Feature request
description: Propose a user-visible improvement or new capability.
title: "[feature] "
labels:
  - type:feature
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the current behavior and the user need.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe the expected behavior and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for the change to be complete.
    validations:
      required: true
